name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão sem o "v" (ex.: 0.1.0-alpha.1)'
        required: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # 22.04: glibc mais antiga, o binário roda em mais distros.
          - platform: linux
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          # Runner Apple Silicon; o x86_64 sai por cross e vira universal.
          - platform: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # O script é bash: sem isto o checkout no Windows vira CRLF e quebra.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - if: matrix.platform == 'linux'
        name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev
      - name: Package
        env:
          MARVYR_DEFAULT_SERVER: ${{ vars.MARVYR_DEFAULT_SERVER }}
          MARVYR_DEFAULT_AUTH_URL: ${{ vars.MARVYR_DEFAULT_AUTH_URL }}
        run: bash scripts/package.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Marvyr-${{ matrix.platform }}
          path: dist/Marvyr-v${{ env.VERSION }}-${{ matrix.platform }}-*
          if-no-files-found: error

  # Build web (wasm + WebTransport), só quando o servidor tem porta web.
  # `MARVYR_WEB_SERVER` = IPv4:porta de `MARVYR_WEB_PORT`: o browser não
  # resolve DNS para o wasm.
  web:
    needs: checks
    if: vars.MARVYR_WEB_SERVER != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install trunk
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          MARVYR_PUBLIC_BUILD: '1'
          MARVYR_DEFAULT_SERVER: ${{ vars.MARVYR_WEB_SERVER }}
          MARVYR_DEFAULT_AUTH_URL: ${{ vars.MARVYR_DEFAULT_AUTH_URL }}
        run: |
          export MARVYR_BUILD_SHA="$(git rev-parse --short HEAD)" MARVYR_VERSION_LABEL="$VERSION"
          cd crates/client
          # `./`: o itch serve a página numa subpasta do CDN.
          trunk build --release --cargo-profile wasm-release --public-url ./ --dist ../../dist/web
          cd ../../dist/web && zip -qr "../Marvyr-v${VERSION}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Marvyr-web
          path: dist/Marvyr-v${{ env.VERSION }}-web.zip
          if-no-files-found: error

  # Um job só cria o release: três jobs anexando em paralelo disputam a
  # criação e podem gerar releases duplicados.
  publish:
    needs: [checks, package, web]
    # `web` pulado (sem MARVYR_WEB_SERVER) não barra o release nativo.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Marvyr-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(needs.checks.outputs.version, '-') }}

  itch:
    needs: [checks, package]
    # Dispatch manual gera só os artefatos; itch só em tag.
    if: github.ref_type == 'tag' && vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    environment: itch
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            channel: windows
          - platform: linux
            channel: linux
          - platform: macos
            channel: mac
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::BUTLER_API_KEY ausente; pulando itch."; fi
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Marvyr-${{ matrix.platform }}
          path: dist
      - if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          for archive in dist/Marvyr-v*; do
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "dist/${{ matrix.platform }}" ;;
              *.zip) unzip -q "$archive" -d "dist/${{ matrix.platform }}" ;;
            esac
          done
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - if: steps.gate.outputs.ok == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: butler/butler push "dist/${{ matrix.platform }}" "${ITCH_TARGET}:${{ matrix.channel }}" --userversion "$VERSION"

  itch-web:
    needs: [checks, web]
    if: github.ref_type == 'tag' && vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    environment: itch
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::BUTLER_API_KEY ausente; pulando itch."; fi
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Marvyr-web
          path: dist
      - if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p dist/web
          unzip -q dist/Marvyr-v*-web.zip -d dist/web
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      # Na primeira vez, marque o upload `html5` como "jogável no navegador"
      # no painel do itch.
      - if: steps.gate.outputs.ok == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: butler/butler push dist/web "${ITCH_TARGET}:html5" --userversion "$VERSION"
