name: CI

# Push só na main: branch com PR já roda pelo pull_request (antes rodava
# duas vezes cada push).
on:
  push:
    branches: [main]
  pull_request:

# Commit novo na mesma branch cancela a rodada anterior.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Build web: pega API nativa (thread, UDP, ureq) entrando no client.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p marvyr-client --target wasm32-unknown-unknown -- -D warnings
