[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/protocol",
    "crates/domain-items",
    "crates/domain-economy",
    "crates/domain-crafting",
    "crates/domain-ships",
    "crates/domain-combat",
    "crates/domain-world",
    "crates/server",
    "crates/client",
    "crates/auth-token",
    "crates/auth",
    "crates/tools/db-migrate",
    "crates/tools/marvyr-playtest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]

# Build web (`trunk build --release --cargo-profile wasm-release`): o .wasm
# baixa a cada visita, então tamanho pesa mais que velocidade de compilação.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
