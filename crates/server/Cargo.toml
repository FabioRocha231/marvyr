[package]
name = "marvyr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.15", default-features = false, features = ["bevy_asset", "bevy_state"] }
# WebTransport: o client do browser entra por QUIC (UDP não existe lá).
lightyear = { version = "0.19", features = ["webtransport"] }
marvyr-auth-token = { path = "../auth-token" }
marvyr-domain-combat = { path = "../domain-combat" }
marvyr-domain-crafting = { path = "../domain-crafting" }
marvyr-domain-economy = { path = "../domain-economy" }
marvyr-domain-items = { path = "../domain-items" }
marvyr-domain-ships = { path = "../domain-ships" }
marvyr-domain-world = { path = "../domain-world" }
marvyr-protocol = { path = "../protocol" }
marvyr-shared = { path = "../shared" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = "0.3"

[dev-dependencies]
crossbeam-channel = "0.5"
marvyr-client = { path = "../client" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
